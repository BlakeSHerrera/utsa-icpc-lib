name: Run unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      
      - name: Install dependencies
        run: pip install -r python/requirements_dev.txt
      
      - name: Run Python unit tests
        run: pytest
        working-directory: ./python
